<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lyxen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050b14;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-box {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            border: 3px solid #00ffcc;
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 0px 40px rgba(0, 255, 204, 0.8);
            color: #fff;
        }

        h2 {
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0px 0px 10px rgba(0, 255, 204, 0.6);
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #00ffcc;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            background: #111b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .login-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            box-shadow: 0px 0px 10px rgba(46, 213, 115, 0.5);
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #26af5f;
        }

        #error-msg {
            color: #ff4757;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>LYXEN LOGIN</h2>
        <div class="input-group">
            <label>Username / ID:</label>
            <input type="text" id="login-user" placeholder="Enter ID...">
        </div>
        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="login-pass" placeholder="Enter password...">
        </div>
        <button class="login-btn" onclick="validateLogin()">LOGIN TO GAME</button>
        <div id="error-msg">Invalid ID or Password!</div>
    </div>

    <script>
        function validateLogin() {
            let inputUser = document.getElementById('login-user').value.trim();
            let inputPass = document.getElementById('login-pass').value.trim();

            // Fetching active credentials strictly from browser's localStorage (set via main game/header)
            let correctUser = localStorage.getItem('lyxen_username') || 'Lyxen m';
            let correctPass = localStorage.getItem('lyxen_password') || '12345';

            if (inputUser === correctUser && inputPass === correctPass) {
                // Redirects to main game page (index.html) if matched
                window.location.href = "index.html";
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
